### Merge the LoRA adapter into the base model. Run from the training/ folder.
### Note: DO NOT use quantized model or quantization_bit when merging lora adapters

### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
adapter_name_or_path: saves/qwen25_vl_7b_disaster_m3/lora/sft
template: qwen2_vl
trust_remote_code: true

### export
export_dir: output/Qwen2.5-VL-7B-DisasterM3-merged  # official run_vllm.py needs "qwen", "vl" and "7b" in the path
export_size: 5
export_device: cpu  # choices: [cpu, auto]
export_legacy_format: false
